name: Inspect deploy artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-deploy-artifact.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect dist
        shell: bash
        run: |
          echo '--- DIST TREE ---'
          find dist -maxdepth 4 -type f | sort | sed -n '1,500p'
          echo '--- HTML FILES ---'
          find dist -type f \( -name '*.html' -o -name 'index.html' \) -print | sort
          echo '--- TOP LEVEL ---'
          du -sh dist/* 2>/dev/null || true
