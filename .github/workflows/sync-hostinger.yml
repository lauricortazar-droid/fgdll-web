name: Sync Hostinger mirror and tools

on:
  workflow_run:
    workflows:
      - Validate portal
    types:
      - completed
  workflow_dispatch:

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

    steps:
      - name: Check Hostinger SSH configuration
        id: hostinger
        shell: bash
        run: |
          if [ -z "$HOSTINGER_SSH_PRIVATE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hostinger sync is prepared but HOSTINGER_SSH_PRIVATE_KEY is not configured yet."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout validated main
        if: steps.hostinger.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"
          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/hostinger_fgdll"
          ssh-keygen -y -P '' -f "$HOME/.ssh/hostinger_fgdll" >/dev/null 2>&1
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify Hostinger connection
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf "Hostinger SSH OK\n"'

      - name: Resolve Hostinger targets
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set -eu
              printf "Repository mirror: %s\n" "$HOME/fgdll-web"
              printf "Legacy static root: %s\n" "$HOME/public_html"
              printf "Portal subdomain root: %s\n" "$HOME/domains/fgdll.org/public_html/portal"
              printf "Hostinger backup root: %s\n" "$HOME/domains/fgdll.org/respaldo/public_html"
            '

      - name: Sync repository mirror
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.next' --exclude='.wrangler' --exclude='.sites-runtime' -czf - . | \
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
             set -eu
             DEST="$HOME/fgdll-web"
             NEXT="$HOME/.fgdll-web-next"
             PREV="$HOME/.fgdll-web-prev"
             rm -rf "$NEXT"
             mkdir -p "$NEXT"
             tar -xzf - -C "$NEXT"
             rm -rf "$PREV"
             if [ -d "$DEST" ]; then mv "$DEST" "$PREV"; fi
             mv "$NEXT" "$DEST"
             rm -rf "$PREV"'

      - name: Record synced revision
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" | ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'cat > "$HOME/fgdll-web/.github-synced-sha"'

      - name: Prepare standalone tools for Hostinger
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          rm -rf .hostinger-publish
          mkdir -p .hostinger-publish/herramientas/marca-videos .hostinger-publish/marca
          cp hostinger-static/herramientas/marca-videos/index.html \
            .hostinger-publish/herramientas/marca-videos/index.html
          cp -R public/marca/. .hostinger-publish/marca/
          printf '%s\n' "$GITHUB_SHA" > .hostinger-publish/herramientas/marca-videos/.github-deployed-sha

      - name: Deploy Marca de Videos to Hostinger targets
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          tar -C .hostinger-publish -czf - . | \
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set -eu
              STAGE="$HOME/.fgdll-tools-stage"
              rm -rf "$STAGE"
              mkdir -p "$STAGE"
              tar -xzf - -C "$STAGE"

              deploy_root() {
                ROOT="$1"
                mkdir -p "$ROOT/herramientas" "$ROOT/marca"
                rm -rf "$ROOT/herramientas/marca-videos"
                cp -R "$STAGE/herramientas/marca-videos" "$ROOT/herramientas/marca-videos"
                cp -R "$STAGE/marca/." "$ROOT/marca/"
                test -f "$ROOT/herramientas/marca-videos/index.html"
                test -f "$ROOT/herramientas/marca-videos/.github-deployed-sha"
                test -f "$ROOT/marca/ringbearer.ttf"
                test -f "$ROOT/marca/logo-1.png"
                printf "Deployed tool to %s\n" "$ROOT"
              }

              # Keep the legacy static mirror current.
              deploy_root "$HOME/public_html"

              # Restore the historical document-root layout used by portal.fgdll.org.
              PORTAL_ROOT="$HOME/domains/fgdll.org/public_html/portal"
              mkdir -p "$PORTAL_ROOT"
              deploy_root "$PORTAL_ROOT"

              # Keep the Hostinger backup tree current without changing the production Sites app.
              BACKUP_ROOT="$HOME/domains/fgdll.org/respaldo/public_html"
              deploy_root "$BACKUP_ROOT"

              rm -rf "$STAGE"
            '

      - name: Verify Hostinger deployed revision
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set -eu
              for f in \
                "$HOME/public_html/herramientas/marca-videos/.github-deployed-sha" \
                "$HOME/domains/fgdll.org/public_html/portal/herramientas/marca-videos/.github-deployed-sha" \
                "$HOME/domains/fgdll.org/respaldo/public_html/herramientas/marca-videos/.github-deployed-sha"
              do
                test -s "$f"
                printf "%s: %s\n" "$f" "$(cat "$f")"
              done
            '

      - name: Verify portal.fgdll.org public tool
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          URL="https://portal.fgdll.org/herramientas/marca-videos/"
          STATUS=""
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -L -sS -o /tmp/portal-tool.html -w '%{http_code}' "$URL?rev=$GITHUB_SHA")
            echo "Attempt $attempt: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              grep -q "Tu video, con identidad" /tmp/portal-tool.html
              echo "Hostinger public tool is live at $URL"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Hostinger files are deployed, but portal.fgdll.org still returns HTTP $STATUS. DNS/CDN routing may still point at an unconfigured Hostinger origin."
          exit 0
