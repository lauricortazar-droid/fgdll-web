name: Sync Hostinger mirror

on:
  workflow_run:
    workflows:
      - Validate portal
    types:
      - completed
  workflow_dispatch:

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

    steps:
      - name: Check Hostinger SSH configuration
        id: hostinger
        shell: bash
        run: |
          if [ -z "$HOSTINGER_SSH_PRIVATE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hostinger sync is prepared but HOSTINGER_SSH_PRIVATE_KEY is not configured yet."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout validated main
        if: steps.hostinger.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"

          if ! grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/hostinger_fgdll"; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY does not contain an OpenSSH private key."
            exit 1
          fi

          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/hostinger_fgdll" >/dev/null 2>&1; then
            echo "::error::The Hostinger SSH private key could not be parsed or it has a passphrase."
            exit 1
          fi

          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify Hostinger connection
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf "Hostinger SSH OK\n"'

      - name: Inspect portal.fgdll.org document root
        if: steps.hostinger.outputs.ready == 'true'
        id: portalroot
        shell: bash
        run: |
          ROOT=$(ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set -eu
              for d in \
                "$HOME/domains/portal.fgdll.org/public_html" \
                "$HOME/domains/fgdll.org/public_html/portal" \
                "$HOME/domains/fgdll.org/public_html/portal.fgdll.org" \
                "$HOME/public_html/portal"; do
                if [ -d "$d" ]; then
                  printf "%s\n" "$d"
                  exit 0
                fi
              done
              find "$HOME" -maxdepth 4 -type d \( -name public_html -o -name portal.fgdll.org \) 2>/dev/null | head -20
            ' | head -1)
          if [ -z "$ROOT" ]; then
            echo "::error::Could not detect a document root for portal.fgdll.org"
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected portal root: $ROOT"
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" "printf 'Contents of portal root:\n'; ls -la '$ROOT' | head -40"

      - name: Sync repository mirror
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.next' --exclude='.wrangler' --exclude='.sites-runtime' -czf - . | \
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
             set -eu
             DEST="$HOME/fgdll-web"
             NEXT="$HOME/.fgdll-web-next"
             PREV="$HOME/.fgdll-web-prev"
             rm -rf "$NEXT"
             mkdir -p "$NEXT"
             tar -xzf - -C "$NEXT"
             rm -rf "$PREV"
             if [ -d "$DEST" ]; then mv "$DEST" "$PREV"; fi
             mv "$NEXT" "$DEST"
             rm -rf "$PREV"'

      - name: Record synced revision
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" | ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'cat > "$HOME/fgdll-web/.github-synced-sha"'
