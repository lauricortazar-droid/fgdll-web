name: Sync Hostinger mirror and tools

on:
  workflow_run:
    workflows:
      - Validate portal
    types:
      - completed
  workflow_dispatch:

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}

    steps:
      - name: Check Hostinger SSH configuration
        id: hostinger
        shell: bash
        run: |
          if [ -z "$HOSTINGER_SSH_PRIVATE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hostinger sync is prepared but HOSTINGER_SSH_PRIVATE_KEY is not configured yet."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout validated main
        if: steps.hostinger.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"
          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$HOME/.ssh/hostinger_fgdll"
          ssh-keygen -y -P '' -f "$HOME/.ssh/hostinger_fgdll" >/dev/null 2>&1
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify Hostinger connection
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf "Hostinger SSH OK\n"'

      - name: Inspect portal.fgdll.org document root and runtime
        if: steps.hostinger.outputs.ready == 'true'
        id: portalroot
        shell: bash
        run: |
          ROOT="$HOME_PLACEHOLDER"
          ROOT=$(ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'printf "%s\n" "$HOME/public_html"')
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected portal root: $ROOT"
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set +e
              printf "Portal root: %s\n" "$HOME/public_html"
              printf "Node: "; node --version 2>&1 || true
              printf "npm: "; npm --version 2>&1 || true
              printf "npx: "; npx --version 2>&1 || true
              printf "pm2: "; (pm2 --version 2>&1 | head -1) || true
              printf "Passenger: "; (passenger-config --version 2>&1 | head -1) || true
              printf "PHP: "; (php --version 2>&1 | head -1) || true
              printf "Processes allowed: "; ulimit -u 2>&1 || true
              printf "public_html package.json:\n"
              cat "$HOME/public_html/package.json" 2>/dev/null || true
            '

      - name: Sync repository mirror
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.next' --exclude='.wrangler' --exclude='.sites-runtime' -czf - . | \
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
             set -eu
             DEST="$HOME/fgdll-web"
             NEXT="$HOME/.fgdll-web-next"
             PREV="$HOME/.fgdll-web-prev"
             rm -rf "$NEXT"
             mkdir -p "$NEXT"
             tar -xzf - -C "$NEXT"
             rm -rf "$PREV"
             if [ -d "$DEST" ]; then mv "$DEST" "$PREV"; fi
             mv "$NEXT" "$DEST"
             rm -rf "$PREV"'

      - name: Record synced revision
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" | ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'cat > "$HOME/fgdll-web/.github-synced-sha"'

      - name: Prepare standalone tools for Hostinger
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          rm -rf .hostinger-publish
          mkdir -p .hostinger-publish/herramientas/marca-videos .hostinger-publish/marca
          cp hostinger-static/herramientas/marca-videos/index.html \
            .hostinger-publish/herramientas/marca-videos/index.html
          cp -R public/marca/. .hostinger-publish/marca/
          printf '%s\n' "$GITHUB_SHA" > .hostinger-publish/herramientas/marca-videos/.github-deployed-sha

      - name: Deploy Marca de Videos to Hostinger public_html
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          tar -C .hostinger-publish -czf - . | \
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set -eu
              ROOT="$HOME/public_html"
              NEXT="$HOME/.fgdll-tools-next"
              DEST="$ROOT/herramientas/marca-videos"
              PREV="$HOME/.fgdll-marca-videos-prev"
              rm -rf "$NEXT"
              mkdir -p "$NEXT"
              tar -xzf - -C "$NEXT"
              mkdir -p "$ROOT/herramientas" "$ROOT/marca"
              rm -rf "$PREV"
              if [ -d "$DEST" ]; then mv "$DEST" "$PREV"; fi
              mv "$NEXT/herramientas/marca-videos" "$DEST"
              cp -R "$NEXT/marca/." "$ROOT/marca/"
              rm -rf "$NEXT" "$PREV"
              test -f "$DEST/index.html"
              test -f "$DEST/.github-deployed-sha"
              test -f "$ROOT/marca/ringbearer.ttf"
              test -f "$ROOT/marca/logo-1.png"
              printf "Hostinger tool deployed: %s\n" "$DEST"
            '

      - name: Verify Hostinger deployed revision
        if: steps.hostinger.outputs.ready == 'true'
        shell: bash
        run: |
          set -eu
          REMOTE_SHA=$(ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" 'cat "$HOME/public_html/herramientas/marca-videos/.github-deployed-sha"')
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          echo "Hostinger public_html is on $REMOTE_SHA"
