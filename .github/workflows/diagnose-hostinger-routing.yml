name: Diagnose Hostinger routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hostinger-routing.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Inspect historical Hostinger roots
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set +e
              ROOT="$HOME/domains/fgdll.org/respaldo/public_html"
              echo "--- BACKUP ROOT ---"
              ls -la "$ROOT" | sed -n "1,200p"
              echo "--- BACKUP HTACCESS ---"
              cat "$ROOT/.htaccess" 2>/dev/null || true
              echo "--- BACKUP PORTAL ---"
              find "$ROOT/portal" -maxdepth 3 -type f -printf "%p %s bytes\n" 2>/dev/null | sed -n "1,250p"
              echo "--- PORTAL INDEX HEAD ---"
              sed -n "1,60p" "$ROOT/portal/index.html" 2>/dev/null || true
              echo "--- POSSIBLE HOSTINGER CONFIG ---"
              find "$HOME" -maxdepth 4 -type f \( -name "*.conf" -o -name "*.json" -o -name "*.yaml" -o -name "*.yml" \) -print 2>/dev/null | grep -E "hostinger|domain|hbuild|fgdll" | sed -n "1,200p"
            '
