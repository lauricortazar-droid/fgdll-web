name: Diagnose Hostinger routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hostinger-routing.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Inspect Hostinger domain tree
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set +e
              echo "--- DOMAINS TREE ---"
              find "$HOME/domains" -maxdepth 4 -printf "%M %u %g %p\n" 2>/dev/null | sed -n "1,400p"
              echo "--- FGDLL DOMAIN ROOT FILES ---"
              for d in "$HOME/domains/fgdll.org" "$HOME/domains/fgdll.org/public_html" "$HOME/domains/fgdll.org/portal" "$HOME/domains/fgdll.org/portal/public_html"; do
                if [ -e "$d" ]; then
                  echo "### $d"
                  ls -la "$d" | sed -n "1,160p"
                  if [ -f "$d/.htaccess" ]; then echo "HTACCESS:"; cat "$d/.htaccess"; fi
                  if [ -f "$d/index.html" ]; then echo "INDEX TITLE:"; grep -i -m1 "<title" "$d/index.html" || true; fi
                fi
              done
              echo "--- HOME SYMLINKS ---"
              find "$HOME" -maxdepth 2 -type l -ls 2>/dev/null | sed -n "1,120p"
            '
