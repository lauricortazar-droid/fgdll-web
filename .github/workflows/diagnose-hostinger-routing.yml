name: Diagnose Hostinger routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-hostinger-routing.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: 145.223.104.153
      HOSTINGER_PORT: '65002'
      HOSTINGER_USER: u697333779
      HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          printf '%b\n' "$HOSTINGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/hostinger_fgdll"
          chmod 600 "$HOME/.ssh/hostinger_fgdll"
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Read portal backup configuration
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/hostinger_fgdll" -p "$HOSTINGER_PORT" -o BatchMode=yes \
            "$HOSTINGER_USER@$HOSTINGER_HOST" '
              set +e
              echo "--- PORTAL HTACCESS ---"
              cat "$HOME/domains/fgdll.org/respaldo/public_html/portal/.htaccess" 2>/dev/null || true
              echo "--- HBUILDS CURRENT LINK ---"
              ls -la "$HOME/domains/fgdll.org/respaldo/hbuilds/current" 2>/dev/null || true
              readlink -f "$HOME/domains/fgdll.org/respaldo/hbuilds/current" 2>/dev/null || true
            '
