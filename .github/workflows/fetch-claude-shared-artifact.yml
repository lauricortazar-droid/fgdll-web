name: Fetch Claude shared artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-claude-shared-artifact.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Claude shared snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .claude-import
          curl -L --fail --silent --show-error             -A "Mozilla/5.0"             "https://claude.ai/api/chat_snapshots/443d6bb8-5b0f-4795-a8b8-1211580839e4"             -o .claude-import/snapshot.json
          python - <<'PY'
          import json
          p=".claude-import/snapshot.json"
          with open(p,"r",encoding="utf-8") as f:
              data=json.load(f)
          print("snapshot keys:", list(data)[:20])
          print("messages:", len(data.get("chat_messages", [])))
          PY

      - name: Commit fetched snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-import/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Importar snapshot de artefacto Claude"
          git push
